<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Bro KB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --ink:            #0b0b0b;
    --ink-2:          #52514e;
    --ink-muted:      #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent:         #2a78d6;
    --good:           #0ca30c;
    --warning:        #fab219;
    --serious:        #ec835a;
    --critical:       #d03b3b;
    --up:             #006300;
    --down:           #d03b3b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface:        #1a1a19;
    --ink:            #ffffff;
    --ink-2:          #c3c2b7;
    --ink-muted:      #898781;
    --hairline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --accent:         #3987e5;
    --up:             #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --ink:            #ffffff;
      --ink-2:          #c3c2b7;
      --ink-muted:      #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent:         #3987e5;
      --up:             #0ca30c;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 16px 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .meta { color: var(--ink-muted); font-size: 12.5px; }
  .spacer { flex: 1; }
  button, input, select {
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }

  nav { display: flex; gap: 4px; padding: 10px 24px 0; }
  nav button {
    border: none; background: none; color: var(--ink-2);
    padding: 8px 14px; border-radius: 8px 8px 0 0; font-weight: 600;
  }
  nav button.active { color: var(--ink); background: var(--surface); box-shadow: 0 -1px 0 var(--border) inset; border-bottom: 2px solid var(--accent); }

  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 80px; }
  .hidden { display: none !important; }

  /* KPI tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .tile .value { font-size: 28px; font-weight: 700; line-height: 1.2; }
  .tile .label { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 2px; font-size: 16px; }
  .card .sub { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 10px; }
  .card ul { margin: 8px 0; padding-left: 20px; color: var(--ink-2); }
  .card li { margin: 3px 0; }
  .macro { color: var(--ink-2); font-size: 13.5px; border-left: 3px solid var(--hairline); padding-left: 10px; margin-top: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-size: 12.5px; color: var(--ink-2);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip b { color: var(--ink); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px;
    border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap;
  }
  .badge.bullish { color: var(--up); }
  .badge.bearish { color: var(--down); }
  .badge.st-notified { color: var(--good); }
  .badge.st-summarized { color: var(--accent); }
  .badge.st-new, .badge.st-pending_transcript { color: var(--warning); }
  .badge.st-failed, .badge.st-transcript_failed { color: var(--critical); }
  .badge.st-seen_skipped { color: var(--ink-muted); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--hairline); font-size: 13.5px; vertical-align: top; }
  th { color: var(--ink-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .err { color: var(--critical); font-size: 12px; word-break: break-word; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="search"] { flex: 1; min-width: 220px; }

  .answer {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; white-space: pre-wrap; margin-top: 14px;
  }
  .notice { color: var(--ink-muted); text-align: center; padding: 40px 0; }
  .thesis { color: var(--ink-2); }
</style>
</head>
<body>
<header>
  <h1>📺 Finance Bro <span>KB</span></h1>
  <span class="meta" id="meta">loading…</span>
  <div class="spacer"></div>
  <button id="refresh" title="Reload the knowledge base">↻ Refresh</button>
  <button id="theme" title="Toggle theme">◐</button>
</header>

<nav>
  <button data-tab="feed" class="active">Feed</button>
  <button data-tab="tickers">Tickers</button>
  <button data-tab="pipeline">Pipeline</button>
  <button data-tab="ask">Ask</button>
</nav>

<main>
  <section id="tab-feed">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search summaries and theses (full-text)…">
      <select id="channelFilter"><option value="">All channels</option></select>
    </div>
    <div id="feed"></div>
  </section>

  <section id="tab-tickers" class="hidden">
    <div class="toolbar">
      <input type="search" id="tickerSearch" placeholder="Filter by ticker, e.g. NVDA…">
    </div>
    <div id="tickers"></div>
  </section>

  <section id="tab-pipeline" class="hidden">
    <div class="tiles" id="kpis"></div>
    <div id="pipeline"></div>
  </section>

  <section id="tab-ask" class="hidden">
    <div class="toolbar">
      <input type="password" id="apiKey" placeholder="Gemini API key (stored only in this browser)" style="min-width:300px">
      <input type="search" id="question" placeholder="Ask the knowledge base…" style="flex:1">
      <button id="askBtn">Ask</button>
    </div>
    <div class="meta">Answers are synthesized by Gemini from the knowledge-base records only. The key never leaves your browser except to call Google's API directly.</div>
    <div class="answer hidden" id="answerBox"></div>
  </section>
</main>

<script>
const DB_URL = "https://raw.githubusercontent.com/scheuclu/youtube_finance_bro/main/data/kb.sqlite3";
const STANCE = { buy: "🟢", sell: "🔴", hold: "🟡", watch: "🟡", mentioned: "⚪️" };
const SENTIMENT = { bullish: "▲ bullish", bearish: "▼ bearish", neutral: "◆ neutral", mixed: "± mixed" };
const STATUS_LABEL = {
  notified: "✓ delivered", summarized: "✉ sending", new: "⏳ processing",
  pending_transcript: "⏳ processing", failed: "✗ failed",
  transcript_failed: "✗ no summary", seen_skipped: "– skipped",
};
let db = null;

const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const q = (sql, params=[]) => {
  const stmt = db.prepare(sql); stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
};

async function loadDb() {
  document.getElementById("meta").textContent = "loading…";
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
  const resp = await fetch(`${DB_URL}?t=${Date.now()}`, { cache: "no-store" });
  if (!resp.ok) throw new Error(`DB fetch failed: ${resp.status}`);
  db = new SQL.Database(new Uint8Array(await resp.arrayBuffer()));
  const last = q("SELECT MAX(updated_at) AS t FROM items")[0]?.t;
  const n = q("SELECT COUNT(*) AS n FROM summaries")[0]?.n ?? 0;
  document.getElementById("meta").textContent = `${n} summaries · updated ${last ? last.replace("T", " ").replace("Z", " UTC") : "never"}`;
  renderAll();
}

/* ---------- Feed ---------- */
function renderFeed() {
  const search = document.getElementById("search").value.trim();
  const channel = document.getElementById("channelFilter").value;
  let itemIds = null;
  if (search) {
    const terms = (search.match(/\w+/g) || []).map(t => `"${t}"`).join(" ");
    if (terms) itemIds = new Set(q("SELECT DISTINCT item_id FROM kb_fts WHERE kb_fts MATCH ?", [terms]).map(r => r.item_id));
  }
  let rows = q(`
    SELECT items.id, items.title, items.url, items.published_at, sources.name AS channel,
           s.tldr, s.summary_md, s.macro_view, s.overall_sentiment
    FROM summaries s JOIN items ON items.id = s.item_id
    JOIN sources ON sources.id = items.source_id
    ${channel ? "WHERE sources.name = ?" : ""}
    ORDER BY items.published_at DESC`, channel ? [channel] : []);
  if (itemIds) rows = rows.filter(r => itemIds.has(r.id));

  const feed = document.getElementById("feed");
  if (!rows.length) { feed.innerHTML = `<div class="notice">No summaries${search ? " match your search" : " yet — they appear here as videos are processed"}.</div>`; return; }
  feed.innerHTML = rows.map(r => {
    const mentions = q("SELECT * FROM ticker_mentions WHERE item_id = ? ORDER BY id", [r.id]);
    const bullets = (r.summary_md || "").split("\n").map(l => l.replace(/^[-*]\s*/, "").trim()).filter(Boolean)
      .map(l => `<li>${esc(l).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")}</li>`).join("");
    const chips = mentions.map(m => {
      const pt = m.price_target ? ` · PT ${m.price_target}${m.price_target_currency ? " " + esc(m.price_target_currency) : ""}` : "";
      return `<span class="chip" title="${esc(m.thesis || "")}" onclick="showTicker('${esc(m.ticker)}')">${STANCE[m.stance] || "⚪️"} <b>${esc(m.ticker)}</b> ${esc(m.stance)}${pt}</span>`;
    }).join("");
    return `<article class="card">
      <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></h3>
      <div class="sub">${esc(r.channel)} · ${esc((r.published_at || "").slice(0, 10))} ·
        <span class="badge ${esc(r.overall_sentiment)}">${SENTIMENT[r.overall_sentiment] || esc(r.overall_sentiment)}</span></div>
      <div>${esc(r.tldr)}</div>
      ${bullets ? `<ul>${bullets}</ul>` : ""}
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      ${r.macro_view ? `<div class="macro">🌍 ${esc(r.macro_view)}</div>` : ""}
    </article>`;
  }).join("");
}

/* ---------- Tickers ---------- */
function renderTickers() {
  const filter = document.getElementById("tickerSearch").value.trim().toUpperCase();
  const rows = q(`
    SELECT tm.ticker, tm.stance, tm.sentiment, tm.thesis, tm.price_target, tm.price_target_currency,
           items.published_at, items.title, items.url, sources.name AS channel
    FROM ticker_mentions tm JOIN items ON items.id = tm.item_id
    JOIN sources ON sources.id = items.source_id
    ${filter ? "WHERE tm.ticker LIKE ?" : ""}
    ORDER BY items.published_at DESC`, filter ? [`%${filter}%`] : []);
  const el = document.getElementById("tickers");
  if (!rows.length) { el.innerHTML = `<div class="notice">No ticker mentions${filter ? " match" : " yet"}.</div>`; return; }
  el.innerHTML = `<table><thead><tr>
      <th>Date</th><th>Ticker</th><th>Stance</th><th>Sentiment</th><th>PT</th><th>Thesis · video</th>
    </tr></thead><tbody>` + rows.map(m => `<tr>
      <td class="num">${esc((m.published_at || "").slice(0, 10))}</td>
      <td><b>${esc(m.ticker)}</b></td>
      <td>${STANCE[m.stance] || "⚪️"} ${esc(m.stance)}</td>
      <td><span class="badge ${esc(m.sentiment)}">${SENTIMENT[m.sentiment] || esc(m.sentiment)}</span></td>
      <td class="num">${m.price_target ? esc(m.price_target) + (m.price_target_currency ? " " + esc(m.price_target_currency) : "") : "–"}</td>
      <td><div class="thesis">${esc(m.thesis || "")}</div>
          <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>
          <span class="sub"> · ${esc(m.channel)}</span></td>
    </tr>`).join("") + "</tbody></table>";
}
function showTicker(t) {
  switchTab("tickers");
  document.getElementById("tickerSearch").value = t;
  renderTickers();
}

/* ---------- Pipeline ---------- */
function renderPipeline() {
  const counts = Object.fromEntries(q("SELECT status, COUNT(*) AS n FROM items GROUP BY status").map(r => [r.status, r.n]));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const inflight = (counts.new || 0) + (counts.pending_transcript || 0) + (counts.summarized || 0);
  const tiles = [
    ["Videos tracked", total],
    ["Delivered", counts.notified || 0],
    ["In flight", inflight],
    ["Failed", (counts.failed || 0) + (counts.transcript_failed || 0)],
    ["Skipped (pre-history)", counts.seen_skipped || 0],
  ];
  document.getElementById("kpis").innerHTML = tiles.map(([label, v]) =>
    `<div class="tile"><div class="value">${v}</div><div class="label">${label}</div></div>`).join("");

  const channels = q(`
    SELECT sources.name, COUNT(*) AS n, SUM(items.status = 'notified') AS done, MAX(items.published_at) AS latest
    FROM items JOIN sources ON sources.id = items.source_id GROUP BY sources.id ORDER BY latest DESC`);
  const items = q(`
    SELECT items.title, items.url, items.status, items.published_at, items.updated_at,
           items.transcript_attempts, items.last_error, sources.name AS channel,
           (SELECT COUNT(*) FROM transcripts t WHERE t.item_id = items.id) AS has_transcript
    FROM items JOIN sources ON sources.id = items.source_id
    WHERE items.status != 'seen_skipped'
    ORDER BY items.updated_at DESC LIMIT 50`);

  document.getElementById("pipeline").innerHTML =
    `<h3>Channels</h3><table><thead><tr><th>Channel</th><th>Videos</th><th>Delivered</th><th>Latest video</th></tr></thead><tbody>` +
    channels.map(c => `<tr><td>${esc(c.name)}</td><td class="num">${c.n}</td><td class="num">${c.done}</td><td class="num">${esc((c.latest || "").slice(0, 10))}</td></tr>`).join("") +
    `</tbody></table><h3 style="margin-top:24px">Recent activity</h3>` +
    (items.length ? `<table><thead><tr><th>Video</th><th>Status</th><th>Source</th><th>Updated</th></tr></thead><tbody>` +
      items.map(i => `<tr>
        <td><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><span class="sub"> · ${esc(i.channel)}</span>
            ${i.last_error && !["notified"].includes(i.status) ? `<div class="err">${esc(i.last_error)}</div>` : ""}</td>
        <td><span class="badge st-${esc(i.status)}">${STATUS_LABEL[i.status] || esc(i.status)}</span></td>
        <td>${i.has_transcript ? "captions" : "video (direct)"}</td>
        <td class="num">${esc((i.updated_at || "").replace("T", " ").replace("Z", ""))}</td>
      </tr>`).join("") + "</tbody></table>"
      : `<div class="notice">No processed videos yet.</div>`);
}

/* ---------- Ask ---------- */
async function ask() {
  const key = document.getElementById("apiKey").value.trim();
  const question = document.getElementById("question").value.trim();
  const box = document.getElementById("answerBox");
  if (!key || !question) return;
  localStorage.setItem("gemini_key", key);
  box.classList.remove("hidden");
  box.textContent = "thinking…";

  const records = q(`
    SELECT items.published_at, items.title, sources.name AS channel, s.tldr, s.macro_view, s.overall_sentiment
    FROM summaries s JOIN items ON items.id = s.item_id JOIN sources ON sources.id = items.source_id
    ORDER BY items.published_at DESC LIMIT 40`);
  const mentions = q(`
    SELECT items.published_at, items.title, tm.ticker, tm.stance, tm.sentiment, tm.thesis, tm.price_target
    FROM ticker_mentions tm JOIN items ON items.id = tm.item_id
    ORDER BY items.published_at DESC LIMIT 100`);

  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text:
          "You answer questions from a personal knowledge base of YouTube finance video analyses. " +
          "Base your answer ONLY on the provided records; cite the video title and date for each claim. " +
          "Note disagreements between creators. These are creators' opinions, not verified facts — reflect that framing." }] },
        contents: [{ role: "user", parts: [{ text:
          `<summaries>\n${JSON.stringify(records)}\n</summaries>\n<ticker_mentions>\n${JSON.stringify(mentions)}\n</ticker_mentions>\n\nQuestion: ${question}` }] }],
      }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error?.message || resp.status);
    box.textContent = data.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "(empty response)";
  } catch (e) {
    box.textContent = `Error: ${e.message}`;
  }
}

/* ---------- Chrome ---------- */
function switchTab(name) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== `tab-${name}`));
}
function renderAll() {
  const channels = q("SELECT DISTINCT name FROM sources ORDER BY name");
  const sel = document.getElementById("channelFilter");
  const current = sel.value;
  sel.innerHTML = `<option value="">All channels</option>` + channels.map(c => `<option${c.name === current ? " selected" : ""}>${esc(c.name)}</option>`).join("");
  renderFeed(); renderTickers(); renderPipeline();
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
document.getElementById("search").addEventListener("input", renderFeed);
document.getElementById("channelFilter").addEventListener("change", renderFeed);
document.getElementById("tickerSearch").addEventListener("input", renderTickers);
document.getElementById("refresh").addEventListener("click", loadDb);
document.getElementById("askBtn").addEventListener("click", ask);
document.getElementById("question").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
document.getElementById("apiKey").value = localStorage.getItem("gemini_key") || "";
document.getElementById("theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
});

loadDb().catch(e => { document.getElementById("meta").textContent = e.message; });
</script>
</body>
</html>
