name: poll

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: "Also summarize N most recent already-seen videos (0 = none). Run from CI so titles come back in English."
        default: "0"
        required: false

# One pipeline run at a time; queued (not cancelled) so a run is never
# killed mid-DB-commit.
concurrency:
  group: kb-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Queue backfill (optional)
        if: ${{ github.event.inputs.backfill_limit != '' && github.event.inputs.backfill_limit != '0' }}
        env:
          BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit }}
        run: python -m yfb backfill --limit "$BACKFILL_LIMIT"

      - name: Run pipeline
        run: python -m yfb run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}

      - name: Commit knowledge base
        run: |
          git config user.name "yfb-bot"
          git config user.email "yfb-bot@users.noreply.github.com"
          git add data/kb.sqlite3
          if git diff --cached --quiet; then
            echo "no DB changes"
            exit 0
          fi
          git commit -m "kb: update $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase || true
          done
          echo "push failed after retries" >&2
          exit 1
