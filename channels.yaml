# Channels to watch.
#
# Resolve channel_id from the channel page's *own* identity — the
# `externalId` field or the <link rel="canonical"> URL — or with
#   yt-dlp --print channel_id <any video URL from that channel>
# Do NOT grep the first "channelId" in the page HTML: pages reference other
# channels too, and picking the wrong one silently watches a different channel.
#
# Always set `name` explicitly, from the channel's canonical title
# (channelMetadataRenderer.title, or the @handle). The RSS feed's <title> is
# localized by viewer IP — it would show a German name for an English channel.
channels:
  - channel_id: UCrGLm-Drgv0vbbemwwHeXJw
    name: "Couch Investor"
  - channel_id: UCN5FOXOJfpX-edVOhd2k1kQ
    name: "fokusinvestor"
  # Congressional trade disclosures. Posts ~30s Shorts (~5/month, irregular),
  # so summaries are brief by nature — the value is the ticker/politician
  # facts, not the analysis.
  - channel_id: UCjNN2z0-TQJecNocZT-V1rQ
    name: "Politician Trade Tracker"

settings:
  # Ignore feed entries older than this (guards against feed weirdness and
  # prevents summarizing stale videos when a channel is first added).
  max_video_age_days: 3
